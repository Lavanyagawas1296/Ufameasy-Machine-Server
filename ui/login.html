<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UFAMeasy Login</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Arial, sans-serif; background: #061525; color: #eef7ff; }
    form { width: min(320px, calc(100vw - 40px)); padding: 28px; border: 1px solid #1b4d71; border-radius: 10px; background: #0b1e30; }
    h1 { margin-top: 0; font-size: 22px; } label { display: block; margin: 14px 0 6px; font-size: 13px; }
    input, button { box-sizing: border-box; width: 100%; padding: 10px; border-radius: 6px; font: inherit; }
    input { border: 1px solid #315c79; background: #07192b; color: #fff; } button { margin-top: 20px; border: 0; background: #25b9f0; color: #00131f; font-weight: 700; cursor: pointer; }
    #error { min-height: 18px; margin: 12px 0 0; color: #ff8d8d; font-size: 13px; }
  </style>
</head>
<body>
  <form id="loginForm">
    <h1>UFAMeasy</h1>
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
    <p id="error" role="alert"></p>
  </form>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const error = document.getElementById("error");
      error.textContent = "";
      const response = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify({ username: form.username.value, password: form.password.value })
      });
      if (!response.ok) {
        error.textContent = "Invalid username or password.";
        return;
      }
      window.location.replace("/");
    });
  </script>
</body>
</html>
